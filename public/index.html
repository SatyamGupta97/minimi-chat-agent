<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>minimi chat</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside id="sidebar">
    <button id="new-chat" type="button">+ New chat</button>
    <nav id="conversations" aria-label="Past conversations"></nav>
  </aside>
  <main>
    <header>
      <button id="toggle-sidebar" type="button" aria-label="Toggle history">☰</button>
      <h1 id="title">New chat</h1>
    </header>
    <section id="messages" aria-live="polite">
      <div id="empty" class="empty">
        <h2>Ask me anything.</h2>
        <p>I search the web for anything current, and I remember our past conversations, so you can ask “what did I ask you last Tuesday? Is it still true?”</p>
        <div class="suggestions">
          <button type="button">What are the cheapest serverless Postgres hosts right now?</button>
          <button type="button">What changed in the latest Node.js release?</button>
          <button type="button">What did I ask you yesterday?</button>
        </div>
      </div>
    </section>
    <!-- onsubmit guard: even if the app script failed to load, Send must never reload the page and wipe the message. -->
    <form id="composer" onsubmit="return false">
      <textarea id="input" rows="1" placeholder="Message…" autofocus></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script type="module" src="/app.js"></script>
  <script>
    // If the app module fails to load (e.g. a dependency), say so instead of failing silently.
    window.addEventListener("load", () => setTimeout(() => {
      if (!window.__appReady) document.getElementById("empty").insertAdjacentHTML("afterbegin", '<p class="error">⚠ The app script failed to load. Check the browser console and the terminal running npm run dev.</p>');
    }, 1500));
  </script>
</body>
</html>
